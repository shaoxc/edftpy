[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edftpy"
version = "0.0.1dev0"
license = { file = "LICENSE.txt" }
description = "Density Embedding Scheme with Python"
maintainers = [
	{name = "Pavanello Research Group",		email = "m.pavanello@rutgers.edu"},
	{name = "Xuecheng Shao",				email = "shaoxc@jlu.edu.cn"},
]
requires-python = ">=3.8"
dependencies = [
	'dftpy>=2.1.2',
	'ase>=3.22.0',
]
readme = "README.md"
classifiers = [
	'Development Status :: 3 - Alpha',
	'Intended Audience :: Science/Research',
	'Programming Language :: Python :: 3',
	'Programming Language :: Python :: 3.8',
	'Programming Language :: Python :: 3.9',
	'Programming Language :: Python :: 3.10',
	'Programming Language :: Python :: 3.11',
	'Programming Language :: Python :: 3.12',
	'Topic :: Scientific/Engineering :: Chemistry',
    'Topic :: Scientific/Engineering :: Physics',
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]

[project.scripts]
edftpy = 'edftpy.cui.main:main'

[project.optional-dependencies]
docs = [
	"sphinx",
	"sphinx-rtd-theme",
	"sphinx-panels",
	"sphinx-copybutton",
	"sphinx-inline-tabs",
	"nbsphinx",
	"pandoc"
]
test = [
	"pytest",
	"pytest-cov",
	"pytest-mpi",
]
mpi = [
	"mpi4py",
	"mpi4py-fft",
]

[project.urls]
homepage = "https://gitlab.com/pavanello-research-group/edftpy"
documentation = "http://edftpy.rutgers.edu"
source = "https://gitlab.com/pavanello-research-group/edftpy"

[tool.setuptools]
include-package-data = true
